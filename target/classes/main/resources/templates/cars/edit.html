<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Редактировать авто</title></head>
<body>
<h1>Редактировать автомобиль</h1>
<form th:action="@{|/cars/${car.id}|}" th:object="${car}" method="post">
    Бренд: <input th:field="*{brand}"/> <span th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span><br/>
    Модель: <input th:field="*{model}"/> <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></span><br/>
    Цвет: <input th:field="*{color}"/> <span th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></span><br/>
    Год: <input type="number" th:field="*{year}"/> <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span><br/>
    Цена: <input type="number" step="0.01" th:field="*{price}"/> <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span><br/>
    <button type="submit">Обновить</button>
</form>
<p><a th:href="@{/cars}">К списку</a></p>
</body>
</html>
