<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Автомобили</title></head>
<body>
<h1>Все автомобили</h1>

<div sec:authorize="isAuthenticated()">
    Привет, <span sec:authentication="name"></span>!
    <form th:action="@{/logout}" method="post" style="display:inline">
        <button type="submit">Выход</button>
    </form>
</div>

<form th:action="@{/cars/search}" method="get">
    <input type="text" name="brand" th:value="${brand}" placeholder="Бренд"/>
    <input type="number" step="0.01" name="maxPrice" th:value="${maxPrice}" placeholder="Макс. цена"/>
    <button type="submit">Поиск</button>
</form>

<p>
    <a th:href="@{/}">На главную</a>
    <span sec:authorize="hasRole('ADMIN')"> | <a th:href="@{/cars/new}">Добавить</a></span>
</p>

<table border="1" cellpadding="4">
    <tr><th>ID</th><th>Бренд</th><th>Модель</th><th>Цвет</th><th>Год</th><th>Цена</th><th>Действия</th></tr>
    <tr th:each="c : ${cars}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.brand}"></td>
        <td th:text="${c.model}"></td>
        <td th:text="${c.color}"></td>
        <td th:text="${c.year}"></td>
        <td th:text="${c.price}"></td>
        <td><a th:href="@{|/cars/${c.id}/buy|}">Купить</a></td>
        <td>
      <span sec:authorize="hasRole('ADMIN')">
        <a th:href="@{|/cars/${c.id}/edit|}">Редактировать</a>
        <form th:action="@{|/cars/${c.id}/delete|}" method="post" style="display:inline">
          <button type="submit">Удалить</button>
        </form>
      </span>
        </td>
    </tr>

</table>
</body>
</html>
